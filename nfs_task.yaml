---
- name: configure NFS Server 
  hosts: node1
    #vars:
    #- pkg: nfs-utils
    #- port: 2049/tcp
  vars_files: ./nfs_vars.yaml
  tasks:
    - name: install {{ pkg }}
      yum:
        name: "{{ pkg }}"
        state: present
    
    - name: start and enable nfs service
      service:
        name: nfs-server.service
        state: started
        enabled: yes

    - name: firewall manage - open port 2049/tcp
      firewalld:
        port: "{{ port }}"
        state: enabled
        permanent: true
        immediate: true

    - name: create sharing directory sharing point
      file:
        path: /nfs_share
        state: directory
        mode: "777"

    - name: modify exports file in /etc/
      lineinfile:
        path: /etc/exports
        line: /nfs_share  172.31.13.90(rw,sync)

    - name: exportfs -rv command
      command:
        cmd: exportfs -rav
