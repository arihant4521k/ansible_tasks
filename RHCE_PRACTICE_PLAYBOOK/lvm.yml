---
- name: create a lvm
  hosts: all
  tasks:
    - name: create a partition
      parted:
        device: /dev/sdb
        number: 1
        state: present
        part_end: 100%

    - name: pvcreate
      lvg:
        vg: myvg 
        pvs: /dev/sdb1

    - name: create a lv
      lvol:
        vg: myvg
        lv: mylv
        size: 1G

    - name: format with xfs
      filesystem:
        dev: /dev/myvg/mylv
        fstype: xfs

    - name: create a dir
      file:
        path: /lv
        state: directory

    - name: mount
      mount:
        path: /lv
        src: /dev/myvg/mylv
        fstype: xfs
        state: mounted
