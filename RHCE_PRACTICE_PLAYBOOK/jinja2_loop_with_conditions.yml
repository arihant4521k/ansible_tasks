---
 - name: jinja2 loop with condition
   hosts: all
   vars:
     users:
       - name: alice
         state: present

       - name: catherin
         state: absent

       - name: barry
         state: present

       - name: pandora
         state: absent
   tasks:
     - name: create a user
       user:
         name: "{{ item.name  }}"
         state: present
       loop: "{{ users }}"
       when: item.state == "present"
