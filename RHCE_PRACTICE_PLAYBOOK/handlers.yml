---
- name: install webserver
  hosts: all
  tasks:
    - name: install httpd
      yum:
        name: httpd
        state: present
      notify: start service
    
    - name: install new package
      yum:
        name: notapackage
        state: present
      ignore_errors: yes

    - name: create a user
      user:
        name: alexaaa
        state: present

    - name: create a directory
      file:
        path: /alexaaa
        state: directory

  handlers:
    - name: start service
      service:
        name: httpd
        state: started
