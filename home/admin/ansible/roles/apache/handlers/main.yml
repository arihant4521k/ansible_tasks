---
# handlers file for apache
  
   - name: httpd restrated
     service:
               name: "{{ rhel_service }}"
               state: started
               enabled: yes
     when: ansible_os_family == "RedHat"

   - name: apache restrated
     service:
               name: "{{ ubuntu_service }}"
               state: started
               enabled: yes
     when: ansible_os_family == "Debian"
